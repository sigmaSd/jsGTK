# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow will install Deno/Bun then run linting and tests.
# For more information see: https://github.com/denoland/setup-deno

name: CI

on:
  push:
  pull_request:
    branches: ["master", "dev"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Setup repo
        uses: actions/checkout@v7

      - name: Install GTK dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev xvfb

      - name: Install GTK dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          brew install gtk4 libadwaita
          echo "DYLD_LIBRARY_PATH=/opt/homebrew/lib:/usr/local/lib:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Cache gvsbuild (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: C:\gtk4
          key: ${{ runner.os }}-gvsbuild-gtk4-2026.6.0

      - name: Install GTK dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          $url = "https://github.com/wingtk/gvsbuild/releases/download/2026.6.0/GTK4_Gvsbuild_2026.6.0_x64.zip"
          $zip = "$env:TEMP\gtk4.zip"
          $dest = "C:\gtk4"
          if (!(Test-Path "$dest\bin\gtk-4-1.dll")) {
            Write-Host "Downloading gvsbuild GTK4 (285 MB)..."
            Invoke-WebRequest -Uri $url -OutFile $zip
            Write-Host "Extracting..."
            Expand-Archive -Path $zip -DestinationPath $dest -Force
            Remove-Item $zip
          }
          echo "$dest\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run tests
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            xvfb-run -a deno task test
          else
            deno task test
          fi
        shell: bash
